server:
  port: 8082
  servlet:
    context-path: /report
spring:
  application:
    name: "Reports"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    default: "dev"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true

#springdoc:
