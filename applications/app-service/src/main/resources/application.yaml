#    operationsSorter: "alpha"
#    tagsSorter: "alpha"

logging:
  level:
    root: "INFO"
    org.springframework.web: "DEBUG"
    org.springframework.security: "DEBUG"
    software.amazon.awssdk.auth: DEBUG
    software.amazon.awssdk.request: DEBUG
    software.amazon.awssdk.services.sqs: DEBUG
